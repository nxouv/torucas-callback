<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>とるキャス — 認証完了</title>
    <style>
      body {
        margin: 0;
        background: #f9fafb;
        color: #374151;
        font:
          15px/1.7 system-ui,
          sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      .card {
        box-sizing: border-box;
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 32px;
        width: min(480px, calc(100% - 32px));
      }
      h1 {
        font-size: 22px;
        margin: 0 0 12px;
      }
      button,
      input {
        box-sizing: border-box;
        width: 100%;
        margin: 8px 0;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #d1d5db;
        font: inherit;
      }
      button {
        cursor: pointer;
        background: #0ea5e9;
        color: white;
        border: 0;
      }
      button.secondary {
        background: #f3f4f6;
        color: #374151;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 3px solid #0369a1;
        outline-offset: 2px;
      }
      .small {
        font-size: 12px;
        color: #6b7280;
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1 id="title">認証情報を確認しています</h1>
      <p id="message" role="status"></p>
      <section id="success" hidden>
        <p id="expiry"></p>
        <button id="return">とるキャスに戻る</button>
        <p class="small">ブラウザの確認が表示されたら、とるキャスを開く操作を選択してください。</p>
        <button id="copy">期限付きの認証情報をコピー</button>
        <p class="small">
          戻れない場合は、コピーした認証情報をとるキャスの設定に貼り付けて保存してください。
        </p>
        <label for="token">旧版向けアクセストークン</label>
        <input id="token" type="password" readonly />
        <button id="legacy" class="secondary">旧版向けトークンをコピー</button>
      </section>
    </main>
    <script src="callback.js"></script>
  </body>
</html>
